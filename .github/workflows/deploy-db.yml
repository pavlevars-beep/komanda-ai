name: Migracije baze

# Migracije se puštaju SAMO sa podrazumevane grane i samo kada se promeni
# nešto u supabase/migrations. Ručno pokretanje postoji za slučaj ponovnog
# pokušaja posle prekida.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

# Dve isporuke odjednom nad istom bazom su siguran način da se dobije
# poluprimenjena šema.
concurrency:
  group: db-deploy
  cancel-in-progress: false

jobs:
  provera:
    name: Provera pre isporuke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Ista provera koja štiti svaki push: migracije moraju da prođu na
      # čistoj bazi, sa svim testovima izolacije, PRE nego što dotaknu živu.
      - name: Migracije i testovi izolacije nad čistom bazom
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./scripts/verify-db.sh

  isporuka:
    name: Primeni na Supabase
    needs: provera
    runs-on: ubuntu-latest
    # Okruženje omogućava da se kasnije uključi ručno odobrenje pred produkciju,
    # bez prepravke workflow-a.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Vrednosti se čiste pre upotrebe.
      #
      # Polje za unos secrets-a na GitHub-u lako ostavi novi red na kraju
      # zalepljene vrednosti. On je nevidljiv u UI-ju i maskiran u logu, a
      # Supabase CLI ga odbija uz poruku koja govori o "branch name" i ne
      # navodi pravi uzrok.
      #
      # Prva verzija ove provere je taj slučaj PROPUSTILA: `grep` završni novi
      # red tretira kao kraj linije, pa je `^[a-z]{20}$` prolazio nad
      # vrednošću koja ga sadrži. Zato se sada prvo čisti, pa proverava.
      - name: Pripremi identifikator projekta
        id: ref
        env:
          RAW: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          REF="$(printf '%s' "$RAW" | tr -d '[:space:]')"

          if [ -z "$REF" ]; then
            echo "::error::SUPABASE_PROJECT_REF nije postavljen."
            exit 1
          fi

          if [ "${#REF}" -ne "${#RAW}" ]; then
            echo "::warning::Identifikator je sadržao razmak ili novi red; uklonjeni su."
          fi

          if ! printf '%s' "$REF" | grep -Eq '^[a-z]{20}$'; then
            echo "::error::SUPABASE_PROJECT_REF nije ispravan. Očekuje se tačno 20 malih slova (posle čišćenja: ${#REF} znakova)."
            echo "::error::To je poddomen iz adrese projekta: https://<ovaj-deo>.supabase.co"
            echo "::error::Nalazi se i u Settings -> General -> Reference ID."
            exit 1
          fi

          # Očišćena vrednost se razlikuje od originalne, pa je GitHub više ne
          # maskira sam. Identifikator projekta jeste javan, ali se u logu
          # svejedno ne ispisuje bez potrebe.
          echo "::add-mask::$REF"
          echo "value=$REF" >> "$GITHUB_OUTPUT"

      - name: Proveri da je lozinka baze postavljena
        env:
          PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD nije postavljen. Postavlja se u Supabase -> Settings -> Database -> Reset database password."
            exit 1
          fi
          case "$PASSWORD" in
            *[![:print:]]*) echo "::warning::Lozinka sadrži znak koji nije za štampu; pri primeni se uklanjaju CR i LF." ;;
          esac
          echo "Lozinka baze je postavljena."

      - name: Poveži se sa projektom
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ steps.ref.outputs.value }}"

      - name: Prikaži razliku
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RAW_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Iz lozinke se uklanjaju samo CR i LF. Razmaci se NE diraju — oni
          # mogu biti deo lozinke, novi red ne može.
          export SUPABASE_DB_PASSWORD="$(printf '%s' "$RAW_PASSWORD" | tr -d '\r\n')"
          supabase migration list --linked

      - name: Primeni migracije
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RAW_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # Seed se NE pušta. supabase/seed sadrži demo organizacije, a migracija
        # environment_guard ih ionako odbija u bazi bez razvojne oznake.
        run: |
          export SUPABASE_DB_PASSWORD="$(printf '%s' "$RAW_PASSWORD" | tr -d '\r\n')"
          supabase db push --include-all

      - name: Potvrdi stanje posle primene
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RAW_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          export SUPABASE_DB_PASSWORD="$(printf '%s' "$RAW_PASSWORD" | tr -d '\r\n')"
          supabase migration list --linked
