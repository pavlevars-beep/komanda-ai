name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  app:
    name: TypeScript, lint, testovi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Jedna komanda, ista lokalno i ovde.
      #
      # Redosled nije proizvoljan: `next build` generiše tipove ruta
      # (.next/types/routes.d.ts) koje typedRoutes koristi. Bez njih `Route`
      # degradira na `string`, pa typecheck tiho prestaje da proverava linkove,
      # a lint prijavljuje suvišnim baš one konverzije koje su potrebne.
      #
      # Ranije su ovi koraci išli obrnuto, pa je CI mesecima bio slabiji od
      # lokalne provere — i to bez ijednog znaka da nešto nije u redu.
      - run: npm run verify
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ '0000000000000000000000000000000000000000' }}

  supabase-config:
    name: Supabase config.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # supabase/config.toml čita se tek pri isporuci, pa je greška u njemu
      # ranije stizala kao pad koraka `supabase link` nad ŽIVIM projektom.
      # Tako je pala jedna isporuka: `Invalid db.major_version: 16` — vrednost
      # koju je stariji CLI prihvatao, a noviji odbija.
      #
      # Ovaj posao pušta isti, pinovani CLI nad config-om na svakom push-u, pa
      # se takva greška vidi ovde umesto u produkciji.
      - name: Pročitaj pinovanu verziju CLI-ja
        id: cli
        run: echo "version=$(tr -d '[:space:]' < .github/supabase-cli-version)" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ steps.cli.outputs.version }}

      - name: Proveri da CLI ume da pročita config
        run: |
          # `supabase status` prvo parsira config, pa tek onda gleda kontejnere.
          # Zanima nas isključivo prvi deo: ostale greške (stack nije podignut)
          # su ovde očekivane i ne obaraju posao.
          IZLAZ="$(supabase status 2>&1 || true)"
          echo "$IZLAZ"

          if printf '%s' "$IZLAZ" | grep -qiE 'invalidconfig|Failed reading config'; then
            echo "::error::Supabase CLI $(supabase --version) ne može da pročita supabase/config.toml."
            echo "::error::Ispravite config.toml (ili pinovanu verziju u .github/supabase-cli-version) pre isporuke."
            exit 1
          fi

          echo "config.toml je ispravan za CLI $(supabase --version)."

  database:
    name: Migracije i izolacija tenanta
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Instaliraj psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Ovaj korak je razlog zbog kojeg izolacija tenanta ne može tiho da se pokvari:
      # nova tabela bez RLS-a, UPDATE politika bez WITH CHECK ili politika koja
      # curi podatke preko granice organizacije obaraju build.
      - name: Migracije, seed i testovi izolacije
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./scripts/verify-db.sh
