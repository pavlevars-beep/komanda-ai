# Konfiguracija Supabase CLI.
#
# project_id je lokalni naziv, ne identifikator projekta u oblaku — taj se
# prosleđuje kroz SUPABASE_PROJECT_REF pri povezivanju i ne stoji u repou.

project_id = "komanda-ai"

[db]
port = 54322
major_version = 16

[api]
port = 54321
# Šema `app` se NAMERNO ne izlaže kroz PostgREST.
# U njoj su pomoćne funkcije autorizacije; one se pozivaju iz RLS politika i
# iz tankih omotača u `public`, nikad direktno spolja.
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[studio]
port = 54323

[inbucket]
# Hvata poštu u lokalnom razvoju (pozivnice, reset lozinke).
port = 54324

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false            # Nalozi se prave isključivo pozivnicom.

[auth.email]
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[analytics]
enabled = false
